apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab
spec:
  parentRefs:
  - name: lab-gw
    sectionName: http
  hostnames:
  - lab.test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: go-k8s-lab
      weight: 90
      port: 80
    - name: whoami
      weight: 10
      port: 80
  - matches:
      - path:
          type: PathPrefix
          value: /api
    backendRefs:
    - name: echo
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: X-VERSION
        value: v2
    backendRefs:
      - name: whoami
        port: 80
