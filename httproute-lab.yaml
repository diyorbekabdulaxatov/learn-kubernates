apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab
spec:
  parentRefs:
  - name: lab-gw
    sectionName: http
  hostnames:
  - lab.test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: go-k8s-lab
      port: 80
  - matches:
      - path:
          type: PathPrefix
          value: /api
    backendRefs:
    - name: echo
      port: 80
