apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-k8s-lab
  namespace: go-lab
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.abdulaxatov.uz
      secretName: go-k8s-lab-tls
  rules:
    - host: app.abdulaxatov.uz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-k8s-lab
                port:
                  number: 80
