apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lab.test
      secretName: lab-test-tls
  rules:
    - host: lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-k8s-lab
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
