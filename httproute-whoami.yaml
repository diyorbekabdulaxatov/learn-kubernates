apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
spec:
  parentRefs:
  - name: lab-gw
    sectionName: http
  hostnames:
  - lab.test
  rules:
  - matches:
    - path:
       type: PathPrefix
       value: /whoami
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: whoami
      port: 80
